<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Atur prioritas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',sans-serif}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;color:{{c.ink}};display:flex;flex-direction:column;position:relative;overflow:hidden;background-color:{{c.base}};background-image:radial-gradient(circle at 0% 0%,{{c.b1}} 0,transparent 45%),radial-gradient(circle at 100% 50%,{{c.b2}} 0,transparent 40%),radial-gradient(circle at 20% 100%,{{c.b3}} 0,transparent 45%)">
  <div style="display:flex;align-items:center;gap:8px;padding:10px 12px">
    <a href="Filter.dc.html" aria-label="Kembali" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span style="flex:1;font-size:13px;font-weight:600;color:{{c.muted}}">Langkah 2 dari 2</span>
    <span style="font-size:13px;font-weight:600;color:{{c.accentInk}};padding-right:8px">Reset</span>
  </div>
  <div style="height:4px;margin:0 20px;border-radius:2px;background:{{c.accent}}"></div>

  <div style="padding:18px 20px 14px;display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-weight:800;font-size:26px;letter-spacing:-.02em">Apa yang paling penting?</h1>
    <p style="margin:0;font-size:13px;line-height:1.5;color:{{c.muted}}">Seret untuk mengurutkan. Paling atas dapat bobot terbesar.</p>
  </div>

  <div style="padding:0 16px;display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div style="height:56px;box-sizing:border-box;border-radius:16px;padding:0 12px 0 10px;display:flex;align-items:center;gap:12px;background:{{r.bg}};backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:{{r.border}};box-shadow:{{r.shadow}};transform:{{r.tf}}">
        <span style="width:36px;height:36px;border-radius:10px;flex:none;background:{{c.soft}};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.accentInk}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg></span>
        <div style="flex:1;display:flex;flex-direction:column;min-width:0"><span style="font-weight:700;font-size:14px">{{r.no}}. {{r.name}}</span><span style="font-size:11px;color:{{c.muted}}">{{r.hint}}</span></div>
        <span style="font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:{{c.soft}};color:{{c.accentInk}}">{{r.w}}</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="{{c.muted}}" aria-hidden="true"><circle cx="5" cy="3" r="1.3"/><circle cx="11" cy="3" r="1.3"/><circle cx="5" cy="8" r="1.3"/><circle cx="11" cy="8" r="1.3"/><circle cx="5" cy="13" r="1.3"/><circle cx="11" cy="13" r="1.3"/></svg>
      </div>
    </sc-for>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 22px;background:{{c.glassStrong}};backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid {{c.gBorder}}">
    <a href="Hasil.dc.html" style="height:52px;border-radius:16px;background:{{c.accent}};color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;box-shadow:0 8px 20px {{c.glow}}">Tampilkan hasil</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palet":{"editor":"enum","options":["Laut","Mint","Peach","Sakura"],"default":"Laut","section":"Warna"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = {base:'#F3F6FB',ink:'#1A1D24',muted:'#4E5463',line:'#E3E7EE',glass:'rgba(255,255,255,.55)',glassStrong:'rgba(255,255,255,.78)',gBorder:'rgba(255,255,255,.9)',gShadow:'rgba(30,45,90,.10)'};
    const P = {
      Laut:{accent:'#1D5FD1',accentInk:'#1A55BC',soft:'#E3ECFD',glow:'rgba(29,95,209,.28)',b1:'#B7D0FF',b2:'#C6EDFF',b3:'#DDE9FF'},
      Mint:{accent:'#0E7C66',accentInk:'#0B6B58',soft:'#DDF4EC',glow:'rgba(14,124,102,.26)',b1:'#B8EDDB',b2:'#CFF3EA',b3:'#DFF6EE'},
      Peach:{accent:'#C0391D',accentInk:'#A9321A',soft:'#FFE7DD',glow:'rgba(192,57,29,.24)',b1:'#FFCDB8',b2:'#FFE3CF',b3:'#FFEFE5'},
      Sakura:{accent:'#C2316E',accentInk:'#A82A60',soft:'#FFE1EC',glow:'rgba(194,49,110,.24)',b1:'#FFC7DC',b2:'#FFDCE8',b3:'#FFEAF1'}
    };
    const c = Object.assign({}, L, P[this.props.palet] || P.Laut);
    const I = {
      wallet:'M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM16 12.5h2',
      pin:'M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11zM12 8.5v3',
      shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
      star:'M12 3l2.6 5.6 6.1.7-4.5 4.1 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.3l6.1-.7z',
      bag:'M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0',
      expand:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',
      user:'M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4 21c1-4 4-6 8-6s7 2 8 6',
      leaf:'M5 19c0-8 6-14 15-14 0 9-6 15-14 15M5 19l7-7'
    };
    const data = [
      ['Biaya sewa','Makin murah makin baik','22,2%','wallet'],
      ['Jarak ke kampus','Makin dekat makin baik','19,4%','pin'],
      ['Keamanan','Sedang dipindah…','16,7%','shield'],
      ['Fasilitas','Makin lengkap makin baik','13,9%','star'],
      ['Akses layanan','Makin dekat makin baik','11,1%','bag'],
      ['Luas kamar','Makin luas makin baik','8,3%','expand'],
      ['Pengelolaan','Makin tertata makin baik','5,6%','user'],
      ['Lingkungan','Makin nyaman makin baik','2,8%','leaf']
    ];
    const rows = data.map((d, i) => {
      const drag = i === 2;
      return {
        no: i + 1, name: d[0], hint: d[1], w: d[2], icon: I[d[3]],
        bg: drag ? c.glassStrong : c.glass,
        border: drag ? '2px solid ' + c.accent : '1px solid ' + c.gBorder,
        shadow: drag ? '0 14px 28px ' + c.glow : '0 4px 12px ' + c.gShadow,
        tf: drag ? 'scale(1.03)' : 'none'
      };
    });
    return { c, rows };
  }
}
</script>
</body>
</html>
